
services:
  app:
    container_name: Beneficiary_manager

    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=Beneficiary_manager
      

    depends_on:
      - db

  db:
    container_name: Beneficiary_manager_DB
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Beneficiary_manager
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "Beneficiary_manager"]
      interval: 10s
      retries: 5
      timeout: 5s
      start_period: 5s

volumes:
  postgres_data:
    driver: local
